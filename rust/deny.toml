# cargo-deny policy is enforced in the coordinated Phase 10 CI lane.

[graph]
targets = [
  { triple = "aarch64-apple-darwin" },
]

[advisories]
yanked = "deny"
ignore = []

[licenses]
# Modern cargo-deny denies unlicensed crates and licenses absent from this allow-list by default.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# ADR-0007 requires exact dependency pins. These private-workspace Git dependencies are
# locked to immutable revs in Cargo.toml/Cargo.lock; cargo otherwise reports them as wildcards.
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# ADR-0007: allow only the exact grammar remotes whose immutable revs are pinned in
# Cargo.toml and Cargo.lock; keep unknown Git sources fail-closed.
allow-git = [
  "https://github.com/alex-pinkus/tree-sitter-swift",
  "https://github.com/tree-sitter/tree-sitter-c",
  "https://github.com/tree-sitter/tree-sitter-c-sharp",
  "https://github.com/tree-sitter/tree-sitter-cpp",
  "https://github.com/tree-sitter/tree-sitter-go",
  "https://github.com/tree-sitter/tree-sitter-java",
  "https://github.com/tree-sitter/tree-sitter-javascript",
  "https://github.com/tree-sitter/tree-sitter-php",
  "https://github.com/tree-sitter/tree-sitter-python",
  "https://github.com/tree-sitter/tree-sitter-ruby",
  "https://github.com/tree-sitter/tree-sitter-rust",
  "https://github.com/tree-sitter/tree-sitter-typescript",
]
