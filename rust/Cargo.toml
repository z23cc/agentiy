[workspace]
members = [
    "crates/proto",
    "crates/runtime",
    "crates/ffi",
    "tools/xtask",
]
default-members = [
    "crates/proto",
    "crates/runtime",
    "crates/ffi",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
agentry-proto = { path = "crates/proto", version = "=0.1.0" }
agentry-runtime = { path = "crates/runtime", version = "=0.1.0" }
nix = "=0.30.1"
pcre2 = "=0.2.11"
proptest = "=1.7.0"
tokio = "=1.47.1"
uniffi = "=0.32.0"
uniffi_bindgen = "=0.32.0"
anyhow = "=1.0.104"
camino = "=1.2.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
debug = 2
strip = false
lto = "thin"

[profile.bench]
debug = 2
strip = false
