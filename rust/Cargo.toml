[workspace]
members = [
    "crates/proto",
    "crates/runtime",
    "crates/ffi",
    "tools/xtask",
]
default-members = [
    "crates/proto",
    "crates/runtime",
    "crates/ffi",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
agentry-proto = { path = "crates/proto", version = "=0.1.0" }
agentry-runtime = { path = "crates/runtime", version = "=0.1.0" }
nix = "=0.30.1"
pcre2 = "=0.2.11"
proptest = "=1.7.0"
tokio = "=1.47.1"
uniffi = "=0.32.0"
uniffi_bindgen = "=0.32.0"
anyhow = "=1.0.104"
camino = "=1.2.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tree-sitter = "=0.25.10"
tree-sitter-c = { git = "https://github.com/tree-sitter/tree-sitter-c", rev = "b780e47fc780ddc8da13afa35a3f4ed5c157823d" }
tree-sitter-cpp = { git = "https://github.com/tree-sitter/tree-sitter-cpp", rev = "f41e1a044c8a84ea9fa8577fdd2eab92ec96de02" }
tree-sitter-c-sharp = { git = "https://github.com/tree-sitter/tree-sitter-c-sharp.git", rev = "cac6d5fb595f5811a076336682d5d595ac1c9e85" }
tree-sitter-go = { git = "https://github.com/tree-sitter/tree-sitter-go", rev = "1547678a9da59885853f5f5cc8a99cc203fa2e2c" }
tree-sitter-java = { git = "https://github.com/tree-sitter/tree-sitter-java", rev = "94703d5a6bed02b98e438d7cad1136c01a60ba2c" }
tree-sitter-javascript = { git = "https://github.com/tree-sitter/tree-sitter-javascript", rev = "44c892e0be055ac465d5eeddae6d3e194424e7de" }
tree-sitter-php = { git = "https://github.com/tree-sitter/tree-sitter-php.git", rev = "5b5627faaa290d89eb3d01b9bf47c3bb9e797dea" }
tree-sitter-python = { git = "https://github.com/tree-sitter/tree-sitter-python", rev = "293fdc02038ee2bf0e2e206711b69c90ac0d413f" }
tree-sitter-ruby = { git = "https://github.com/tree-sitter/tree-sitter-ruby", rev = "71bd32fb7607035768799732addba884a37a6210" }
tree-sitter-rust = { git = "https://github.com/tree-sitter/tree-sitter-rust", rev = "77a3747266f4d621d0757825e6b11edcbf991ca5" }
tree-sitter-swift = { git = "https://github.com/alex-pinkus/tree-sitter-swift", rev = "31d17fe7e818a2048c808b5c6fdc2dc792f4f5b5" }
tree-sitter-typescript = { git = "https://github.com/tree-sitter/tree-sitter-typescript", rev = "f975a621f4e7f532fe322e13c4f79495e0a7b2e7" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
debug = 2
strip = false
lto = "thin"

[profile.bench]
debug = 2
strip = false
