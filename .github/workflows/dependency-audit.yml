name: Dependency Audit

# Weekly Linux `cargo audit` at 1x billing. Kept out of `ci.yml` so a scheduled
# success cannot complete the `CI` workflow on `main` and wake `main-beta.yml`.
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency Audit
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit Rust dependencies
        working-directory: rust
        run: cargo audit --file Cargo.lock
