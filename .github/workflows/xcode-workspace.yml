name: Xcode Workspace Validation

on:
  workflow_dispatch:

# Cost policy (2026-09-04): no weekly macOS cron. Generator contract tests run
# locally via `preflight.sh pr-ready` on Xcode-boundary path changes. Full
# `xcode-validate` (`xcodebuild -list`) is explicit dispatch or `make xcode-validate`.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Generated Xcode Workspace
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test Xcode workspace generator
        run: make xcode-generator-test

      - name: Validate generated Xcode workspace
        run: make xcode-validate
