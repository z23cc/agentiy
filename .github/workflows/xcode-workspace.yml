name: Xcode Workspace Validation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'

# Cost policy (2026-09-01): the weekly schedule and manual dispatch above are the
# entry points; the former path-filtered `push: main` trigger is covered by
# `preflight.sh pr-ready`, which selects the xcode_workspace_validation lane locally
# whenever those same paths change.
permissions:
  contents: read

jobs:
  validate:
    name: Validate Generated Xcode Workspace
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Test Xcode workspace generator
        run: make xcode-generator-test

      - name: Validate generated Xcode workspace
        run: make xcode-validate
