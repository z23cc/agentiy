name: CI

# Cost policy (2026-09-04): GitHub bills macOS at 10x. This workflow never uses a
# macOS runner and never runs compile, test, lint, or fuzz jobs.
#
# Per-PR / dispatch: secret scan on ubuntu-latest (1x). Heavy validation is local
# (`preflight.sh commit|push|pr-ready`, `make dev-cargo-test`, `make dev-lint`).
#
# Weekly `cargo audit` lives in `dependency-audit.yml`, not here. This workflow is
# named `CI`; `main-beta.yml` publishes a beta when a successful `CI` run completes
# on `main`. A scheduled Linux audit must not be able to satisfy that trigger.
#
# `push: main` stays absent for the same reason: a green no-op CI run on main would
# publish an unvalidated beta.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            -o "/tmp/${archive}"
          tar -xzf "/tmp/${archive}" -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan introduced commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            range="$PUSH_BEFORE_SHA..$CURRENT_SHA"
          else
            range="$CURRENT_SHA"
          fi
          gitleaks git --redact --log-opts="$range" .

      - name: Scan checked-in source tree
        run: gitleaks dir --redact .
